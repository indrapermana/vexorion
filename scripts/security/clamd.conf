Foreground yes
User clamav
LocalSocket /tmp/clamd.sock
FixStaleSocket yes
TCPSocket 3310
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav
LogTime yes
LogClean no
MaxThreads 2
MaxQueue 8
StreamMaxLength 100M
MaxFileSize 100M
MaxScanSize 120M
MaxRecursion 16
MaxFiles 10000
ReadTimeout 30
CommandReadTimeout 5