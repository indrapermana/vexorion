name: AdminUI Frontend

on:
  push:
    branches: [master, develop]
    paths:
      - 'VexorionERP.AdminUI/**'
      - '.github/workflows/adminui.yml'
  pull_request:
    branches: [master, develop]
    paths:
      - 'VexorionERP.AdminUI/**'
      - '.github/workflows/adminui.yml'

defaults:
  run:
    working-directory: VexorionERP.AdminUI

jobs:
  build-and-test:
    name: Build & Test (AdminUI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: VexorionERP.AdminUI/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Unit tests (with coverage)
        run: npm test -- --coverage --reporter=default --reporter=junit --outputFile=test-results.xml

      - name: Build
        run: npm run build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adminui-test-results
          path: VexorionERP.AdminUI/test-results.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adminui-coverage
          path: VexorionERP.AdminUI/coverage/

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: false  # TODO: fix - needs a running dev server in CI (webServer config in playwright.config.ts)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: VexorionERP.AdminUI/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: VexorionERP.AdminUI

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: VexorionERP.AdminUI

      - name: Run E2E tests
        run: npm run e2e
        working-directory: VexorionERP.AdminUI
        env:
          ADMIN_BASE_URL: ${{ secrets.ADMIN_BASE_URL || 'http://localhost:5174' }}
          E2E_TENANT_CODE: ${{ secrets.E2E_TENANT_CODE || 'demo' }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME || 'admin@demo.local' }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD || 'DemoAdmin123!' }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: adminui-playwright-report
          path: VexorionERP.AdminUI/playwright-report/

  deploy:
    name: Deploy to Azure Static Web Apps (AdminUI)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: VexorionERP.AdminUI/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: VexorionERP.AdminUI

      - name: Build
        run: npm run build
        working-directory: VexorionERP.AdminUI
        env:
          VITE_API_BASE_URL: https://api.vexorionerp.com/api

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ADMIN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: VexorionERP.AdminUI/dist
          output_location: ""
          skip_app_build: true
