name: Frontend

on:
  push:
    branches: [master, develop]
    paths:
      - 'VexorionERP.UI/**'
      - 'VexorionERP.AdminUI/**'
      - 'VexorionERP.POS/**'
      - 'VexorionERP.LandingPage/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/actions/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [master, develop]
    paths:
      - 'VexorionERP.UI/**'
      - 'VexorionERP.AdminUI/**'
      - 'VexorionERP.POS/**'
      - 'VexorionERP.LandingPage/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/actions/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:
    inputs:
      deploy_all:
        description: 'Build and deploy all frontend apps regardless of affected graph'
        required: false
        default: false
        type: boolean

jobs:
  # ─────────────────────────────────────────────
  # 1. Build & test — Turbo only runs what changed
  # ─────────────────────────────────────────────
  build-and-test:
    name: Build & Test (affected packages)
    runs-on: ubuntu-latest

    outputs:
      # Flags used by deploy jobs to know if an app dist was produced.
      # We check whether the app appears in the Turbo affected graph by
      # looking for its dist folder after the build step.
      ui_built: ${{ steps.detect.outputs.ui_built }}
      adminui_built: ${{ steps.detect.outputs.adminui_built }}
      pos_built: ${{ steps.detect.outputs.pos_built }}
      landing_built: ${{ steps.detect.outputs.landing_built }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history needed for --filter=...[HEAD^1] to work correctly
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Ensure Linux native bindings
        run: |
          npm --workspace VexorionERP.POS install --no-save @rolldown/binding-linux-x64-gnu@1.0.0-rc.17
          npm --workspace VexorionERP.AdminUI install --no-save @rolldown/binding-linux-x64-gnu@1.0.0-rc.17
          npm --workspace VexorionERP.UI install --no-save @rolldown/binding-linux-x64-gnu@1.0.0-rc.15

      - name: Validate production API base URL secret
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || ( "${{ github.event_name }}" == "push" && ( "${{ github.ref }}" == "refs/heads/master" || "${{ github.ref }}" == "refs/heads/main" ) ) ]]; then
            if [[ -z "${{ secrets.FRONTEND_PROD_API_BASE_URL }}" ]]; then
              echo "FRONTEND_PROD_API_BASE_URL is required for production/frontend deploy builds."
              exit 1
            fi
          fi

      # Turbo builds only packages affected since the previous commit.
      # The dependency graph means: if packages/ui changed → all 3 apps rebuild.
      # If only VexorionERP.UI changed → only that app + @vexorion/ui (cached) rebuild.
      - name: Build frontend packages
        env:
          VITE_API_BASE_URL: ${{ secrets.FRONTEND_PROD_API_BASE_URL }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.deploy_all }}" == "true" ]]; then
            npx turbo run build --filter=vexorionerp-ui --filter=vexorionerp-adminui --filter=vexorionerp-pos --filter=vexorionerp-landing
          else
            npx turbo run build --filter=...[HEAD^1]
          fi

      - name: Type check affected packages
        run: npx turbo run typecheck --filter=...[HEAD^1]
        continue-on-error: false

      - name: Lint affected packages
        run: npx turbo run lint --filter=...[HEAD^1]

      - name: Test affected packages (with coverage)
        run: >-
          npx turbo run test:run --filter=...[HEAD^1]
          -- --coverage --reporter=default --reporter=junit --outputFile=test-results.xml

      # Detect which app dists were produced so deploy jobs can conditionally run.
      - name: Detect built apps
        id: detect
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.deploy_all }}" == "true" ]]; then
            echo "ui_built=true" >> "$GITHUB_OUTPUT"
            echo "adminui_built=true" >> "$GITHUB_OUTPUT"
            echo "pos_built=true" >> "$GITHUB_OUTPUT"
            echo "landing_built=true" >> "$GITHUB_OUTPUT"
          else
            echo "ui_built=$([[ -d VexorionERP.UI/dist ]] && echo 'true' || echo 'false')" >> "$GITHUB_OUTPUT"
            echo "adminui_built=$([[ -d VexorionERP.AdminUI/dist ]] && echo 'true' || echo 'false')" >> "$GITHUB_OUTPUT"
            echo "pos_built=$([[ -d VexorionERP.POS/dist ]] && echo 'true' || echo 'false')" >> "$GITHUB_OUTPUT"
            echo "landing_built=$([[ -d VexorionERP.LandingPage/dist ]] && echo 'true' || echo 'false')" >> "$GITHUB_OUTPUT"
          fi

      - name: Print build detection flags
        run: |
          echo "ui_built=${{ steps.detect.outputs.ui_built }}"
          echo "adminui_built=${{ steps.detect.outputs.adminui_built }}"
          echo "pos_built=${{ steps.detect.outputs.pos_built }}"
          echo "landing_built=${{ steps.detect.outputs.landing_built }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: |
            VexorionERP.UI/test-results.xml
            VexorionERP.AdminUI/test-results.xml
            VexorionERP.POS/test-results.xml
            VexorionERP.LandingPage/test-results.xml

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            VexorionERP.UI/coverage/
            VexorionERP.AdminUI/coverage/
            VexorionERP.POS/coverage/
            VexorionERP.LandingPage/coverage/

      # Keep built dists so deploy jobs can consume them without rebuilding.
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: |
            VexorionERP.UI/dist/
            VexorionERP.AdminUI/dist/
            VexorionERP.POS/dist/
            VexorionERP.LandingPage/dist/
          if-no-files-found: ignore

  # ─────────────────────────────────────────────
  # 2. E2E — split per app for isolation and reruns
  # ─────────────────────────────────────────────
  e2e-ui:
    name: E2E Tests (Playwright UI)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: >-
      false &&
      needs.build-and-test.result == 'success' &&
      github.event_name != 'pull_request' &&
      needs.build-and-test.outputs.ui_built == 'true'
    env:
      CI: true
      E2E_TENANT_CODE: ${{ secrets.E2E_TENANT_CODE }}
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      VITE_API_BASE_URL: ${{ secrets.E2E_API_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required E2E secrets
        id: e2e-secrets
        shell: bash
        run: |
          missing=0
          [[ -z "${{ secrets.E2E_API_BASE_URL }}" ]] && missing=1
          [[ -z "${{ secrets.E2E_USERNAME }}" ]] && missing=1
          [[ -z "${{ secrets.E2E_PASSWORD }}" ]] && missing=1

          if [[ "$missing" -eq 1 ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping UI e2e because required secrets are missing."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip E2E (UI)
        if: steps.e2e-secrets.outputs.ready != 'true'
        run: echo "UI e2e skipped due to missing secrets"

      - name: Setup frontend e2e environment
        if: steps.e2e-secrets.outputs.ready == 'true'
        uses: ./.github/actions/frontend-e2e-setup

      - name: Run E2E (UI)
        if: steps.e2e-secrets.outputs.ready == 'true'
        run: npx turbo run e2e --filter=vexorionerp-ui

      - name: Upload Playwright reports
        if: always() && steps.e2e-secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports-ui
          path: |
            VexorionERP.UI/playwright-report/
            VexorionERP.UI/test-results/
          if-no-files-found: ignore

  e2e-adminui:
    name: E2E Tests (Playwright AdminUI)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: >-
      false &&
      needs.build-and-test.result == 'success' &&
      github.event_name != 'pull_request' &&
      needs.build-and-test.outputs.adminui_built == 'true'
    env:
      CI: true
      E2E_TENANT_CODE: ${{ secrets.E2E_TENANT_CODE }}
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      VITE_API_BASE_URL: ${{ secrets.E2E_API_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required E2E secrets
        id: e2e-secrets
        shell: bash
        run: |
          missing=0
          [[ -z "${{ secrets.E2E_API_BASE_URL }}" ]] && missing=1
          [[ -z "${{ secrets.E2E_USERNAME }}" ]] && missing=1
          [[ -z "${{ secrets.E2E_PASSWORD }}" ]] && missing=1

          if [[ "$missing" -eq 1 ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping AdminUI e2e because required secrets are missing."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip E2E (AdminUI)
        if: steps.e2e-secrets.outputs.ready != 'true'
        run: echo "AdminUI e2e skipped due to missing secrets"

      - name: Setup frontend e2e environment
        if: steps.e2e-secrets.outputs.ready == 'true'
        uses: ./.github/actions/frontend-e2e-setup

      - name: Run E2E (AdminUI)
        if: steps.e2e-secrets.outputs.ready == 'true'
        run: npx turbo run e2e --filter=vexorionerp-adminui

      - name: Upload Playwright reports
        if: always() && steps.e2e-secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports-adminui
          path: |
            VexorionERP.AdminUI/playwright-report/
            VexorionERP.AdminUI/test-results/
          if-no-files-found: ignore

  e2e-pos:
    name: E2E Tests (Playwright POS)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: >-
      false &&
      needs.build-and-test.result == 'success' &&
      github.event_name != 'pull_request' &&
      needs.build-and-test.outputs.pos_built == 'true'
    env:
      CI: true
      E2E_TENANT_CODE: ${{ secrets.E2E_TENANT_CODE }}
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      VITE_API_BASE_URL: ${{ secrets.E2E_API_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required E2E secrets
        id: e2e-secrets
        shell: bash
        run: |
          missing=0
          [[ -z "${{ secrets.E2E_API_BASE_URL }}" ]] && missing=1
          [[ -z "${{ secrets.E2E_USERNAME }}" ]] && missing=1
          [[ -z "${{ secrets.E2E_PASSWORD }}" ]] && missing=1

          if [[ "$missing" -eq 1 ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping POS e2e because required secrets are missing."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip E2E (POS)
        if: steps.e2e-secrets.outputs.ready != 'true'
        run: echo "POS e2e skipped due to missing secrets"

      - name: Setup frontend e2e environment
        if: steps.e2e-secrets.outputs.ready == 'true'
        uses: ./.github/actions/frontend-e2e-setup

      - name: Run E2E (POS)
        if: steps.e2e-secrets.outputs.ready == 'true'
        run: npx turbo run e2e --filter=vexorionerp-pos

      - name: Upload Playwright reports
        if: always() && steps.e2e-secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reports-pos
          path: |
            VexorionERP.POS/playwright-report/
            VexorionERP.POS/test-results/
          if-no-files-found: ignore

  # ─────────────────────────────────────────────
  # 3. Cloudflare Pages deployments — opt-in while Azure remains the rollback target.
  # Builds are already scoped by Turbo's affected graph. Shared package or lockfile
  # changes correctly rebuild all consumers; app-only changes deploy only that app.
  # ─────────────────────────────────────────────
  deploy-cloudflare-ui:
    name: Deploy to Cloudflare Pages (UI)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: >-
      vars.CLOUDFLARE_PAGES_DEPLOY_ENABLED == 'true' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        )
      ) &&
      (
        needs.build-and-test.outputs.ui_built == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_all == true)
      )
    environment: production
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist

      - name: Configure master as the production branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          curl --fail-with-body --request PATCH
          "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/vexorionerp-app"
          --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          --header "Content-Type: application/json"
          --data '{"production_branch":"master"}'

      - name: Deploy UI
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy VexorionERP.UI/dist --project-name=vexorionerp-app --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  deploy-cloudflare-adminui:
    name: Deploy to Cloudflare Pages (AdminUI)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: >-
      vars.CLOUDFLARE_PAGES_DEPLOY_ENABLED == 'true' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        )
      ) &&
      (
        needs.build-and-test.outputs.adminui_built == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_all == true)
      )
    environment: production
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist

      - name: Configure master as the production branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          curl --fail-with-body --request PATCH
          "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/vexorionerp-admin"
          --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          --header "Content-Type: application/json"
          --data '{"production_branch":"master"}'

      - name: Deploy AdminUI
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy VexorionERP.AdminUI/dist --project-name=vexorionerp-admin --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  deploy-cloudflare-pos:
    name: Deploy to Cloudflare Pages (POS)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: >-
      vars.CLOUDFLARE_PAGES_DEPLOY_ENABLED == 'true' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        )
      ) &&
      (
        needs.build-and-test.outputs.pos_built == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_all == true)
      )
    environment: production
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist

      - name: Configure master as the production branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          curl --fail-with-body --request PATCH
          "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/vexorionerp-pos"
          --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          --header "Content-Type: application/json"
          --data '{"production_branch":"master"}'

      - name: Deploy POS
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy VexorionERP.POS/dist --project-name=vexorionerp-pos --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  deploy-cloudflare-landing:
    name: Deploy to Cloudflare Pages (Landing page)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: >-
      vars.CLOUDFLARE_PAGES_DEPLOY_ENABLED == 'true' &&
      vars.CLOUDFLARE_LANDING_DEPLOY_ENABLED == 'true' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        )
      ) &&
      (
        needs.build-and-test.outputs.landing_built == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_all == true)
      )
    environment: production
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist

      - name: Configure master as the production branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          curl --fail-with-body --request PATCH
          "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/vexorionerp-landing"
          --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          --header "Content-Type: application/json"
          --data '{"production_branch":"master"}'

      - name: Deploy landing page
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy VexorionERP.LandingPage/dist --project-name=vexorionerp-landing --branch=${{ github.ref_name }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────
  # 4. Existing Azure deployments — keep through Cloudflare cutover validation.
  # ─────────────────────────────────────────────
  deploy-ui:
    name: Deploy to Azure Static Web Apps (UI)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: >-
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        )
      ) &&
      (
        needs.build-and-test.outputs.ui_built == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_all == true)
      )
    environment: production

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_UI }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: VexorionERP.UI/dist
          output_location: ""
          skip_app_build: true

  deploy-adminui:
    name: Deploy to Azure Static Web Apps (AdminUI)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: >-
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        )
      ) &&
      (
        needs.build-and-test.outputs.adminui_built == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_all == true)
      )
    environment: production

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ADMIN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: VexorionERP.AdminUI/dist
          output_location: ""
          skip_app_build: true

  deploy-pos:
    name: Deploy to Azure Static Web Apps (POS)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: >-
      (
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        )
      ) &&
      (
        needs.build-and-test.outputs.pos_built == 'true' ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_all == true)
      )
    environment: production

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POS }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: VexorionERP.POS/dist
          output_location: ""
          skip_app_build: true
