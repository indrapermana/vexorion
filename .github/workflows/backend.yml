name: Backend

on:
  push:
    branches: [master, develop]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
      - '**.props'
      - '**.targets'
      - 'VexorionERP/appsettings.json'
      - 'NuGet.config'
      - 'Dockerfile'
      - '.dockerignore'
      - 'global.json'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [master, develop]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
      - '**.props'
      - '**.targets'
      - 'VexorionERP/appsettings.json'
      - 'NuGet.config'
      - 'Dockerfile'
      - '.dockerignore'
      - 'global.json'
      - '.github/workflows/backend.yml'

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vexorionerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_NOLOGO: true
      SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests (with coverage)
        run: >-
          dotnet test
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
        env:
          ConnectionStrings__DefaultConnection: >-
            Host=localhost;Port=5432;Database=vexorionerp_test;
            Username=postgres;Password=postgres

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-test-results
          path: TestResults/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: TestResults/**/coverage.cobertura.xml

  deploy-production:
    name: Deploy to Cloud Run (production)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: production

    permissions:
      contents: read
      id-token: write

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
      GCP_IMAGE_NAME: ${{ vars.GCP_IMAGE_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate deployment configuration
        env:
          SIXLABORS_LICENSE_FILE_CONTENT: ${{ secrets.SIXLABORS_LICENSE_FILE }}
          EMAIL__RESENDAPIKEY: ${{ secrets.EMAIL__RESENDAPIKEY }}
          EMAIL__MAINUIBASEURL: ${{ vars.EMAIL__MAINUIBASEURL }}
        run: |
          missing=0
          for variable_name in \
            GCP_PROJECT_ID \
            GCP_REGION \
            GCP_ARTIFACT_REPOSITORY \
            GCP_CLOUD_RUN_SERVICE \
            GCP_IMAGE_NAME \
            GCP_WORKLOAD_IDENTITY_PROVIDER \
            GCP_DEPLOY_SERVICE_ACCOUNT \
            EMAIL__MAINUIBASEURL
          do
            if [[ -z "${!variable_name}" ]]; then
              echo "Missing GitHub production environment variable: $variable_name"
              missing=1
            fi
          done

          if [[ -z "$EMAIL__RESENDAPIKEY" ]]; then
            echo "Missing GitHub production environment secret: EMAIL__RESENDAPIKEY"
            missing=1
          fi

          if [[ -z "$SIXLABORS_LICENSE_FILE_CONTENT" ]]; then
            echo "Missing GitHub production environment secret: SIXLABORS_LICENSE_FILE"
            missing=1
          fi

          exit "$missing"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Prepare Six Labors build secret
        env:
          SIXLABORS_LICENSE_FILE_CONTENT: ${{ secrets.SIXLABORS_LICENSE_FILE }}
        run: |
          license_file="$RUNNER_TEMP/sixlabors.lic"
          printf '%s' "$SIXLABORS_LICENSE_FILE_CONTENT" > "$license_file"
          chmod 600 "$license_file"
          echo "SIXLABORS_LICENSE_FILE_PATH=$license_file" >> "$GITHUB_ENV"

      - name: Build container image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPOSITORY }}/${{ env.GCP_IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker build \
            --secret "id=sixlabors_license,src=$SIXLABORS_LICENSE_FILE_PATH" \
            --tag "$IMAGE_URI" \
            .
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Push container image
        run: |
          docker push "$IMAGE_URI"
          image_digest=$(gcloud artifacts docker images describe "$IMAGE_URI" \
            --project="$GCP_PROJECT_ID" \
            --format='value(image_summary.digest)')
          if [[ -z "$image_digest" ]]; then
            echo "Artifact Registry did not return an image digest."
            exit 1
          fi
          echo "IMAGE_DIGEST_URI=${IMAGE_URI%:*}@$image_digest" >> "$GITHUB_ENV"

      - name: Deploy immutable revision
        env:
          EMAIL__RESENDAPIKEY: ${{ secrets.EMAIL__RESENDAPIKEY }}
          EMAIL__MAINUIBASEURL: ${{ vars.EMAIL__MAINUIBASEURL }}
        run: |
          gcloud run services update "$GCP_CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="$IMAGE_DIGEST_URI" \
            --update-env-vars="^|^EMAIL__RESENDAPIKEY=${EMAIL__RESENDAPIKEY}|EMAIL__MAINUIBASEURL=${EMAIL__MAINUIBASEURL}|EMAIL__REDIRECTPLUSADDRESSING=false" \
            --no-invoker-iam-check \
            --quiet

      - name: Verify deployed revision
        run: |
          service_url=$(gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='value(status.url)')
          deployed_image=$(gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='value(spec.template.spec.containers[0].image)')

          if [[ "$deployed_image" != "$IMAGE_DIGEST_URI" ]]; then
            echo "Cloud Run is not using the image produced by this workflow."
            exit 1
          fi

          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --retry-delay 5 --max-time 30 "$service_url/health/live"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --retry-delay 5 --max-time 30 "$service_url/health/ready"
