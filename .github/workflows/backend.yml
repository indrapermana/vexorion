name: Backend

on:
  push:
    branches: [master, develop]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
      - '**.props'
      - '**.targets'
      - 'VexorionERP/appsettings.json'
      - 'NuGet.config'
      - 'Dockerfile'
      - '.dockerignore'
      - 'global.json'
      - '.github/workflows/backend.yml'
      - 'scripts/release/**'
  pull_request:
    branches: [master, develop]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
      - '**.props'
      - '**.targets'
      - 'VexorionERP/appsettings.json'
      - 'NuGet.config'
      - 'Dockerfile'
      - '.dockerignore'
      - 'global.json'
      - '.github/workflows/backend.yml'
      - 'scripts/release/**'

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test (.NET 10)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vexorionerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_NOLOGO: true
      SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test production release verification script
        run: scripts/release/test-verify-production.sh

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests (with coverage)
        run: >-
          dotnet test
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
        env:
          ConnectionStrings__DefaultConnection: >-
            Host=localhost;Port=5432;Database=vexorionerp_test;
            Username=postgres;Password=postgres

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-test-results
          path: TestResults/

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: TestResults/**/coverage.cobertura.xml

  deploy-development:
    name: Deploy to Cloud Run (development)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: development
    concurrency:
      group: development-cloud-run-deployment
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
      GCP_MIGRATION_JOB: ${{ vars.GCP_MIGRATION_JOB }}
      GCP_MIGRATION_SERVICE_ACCOUNT: ${{ vars.GCP_MIGRATION_SERVICE_ACCOUNT }}
      GCP_MIGRATION_CONNECTION_SECRET: ${{ vars.GCP_MIGRATION_CONNECTION_SECRET }}
      GCP_IMAGE_NAME: ${{ vars.GCP_IMAGE_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate development deployment configuration
        env:
          SIXLABORS_LICENSE_FILE_CONTENT: ${{ secrets.SIXLABORS_LICENSE_FILE }}
        run: |
          missing=0
          for variable_name in \
            GCP_PROJECT_ID \
            GCP_REGION \
            GCP_ARTIFACT_REPOSITORY \
            GCP_CLOUD_RUN_SERVICE \
            GCP_MIGRATION_JOB \
            GCP_MIGRATION_SERVICE_ACCOUNT \
            GCP_MIGRATION_CONNECTION_SECRET \
            GCP_IMAGE_NAME \
            GCP_WORKLOAD_IDENTITY_PROVIDER \
            GCP_DEPLOY_SERVICE_ACCOUNT
          do
            if [[ -z "${!variable_name}" ]]; then
              echo "Missing GitHub development environment variable: $variable_name"
              missing=1
            fi
          done

          if [[ -z "$SIXLABORS_LICENSE_FILE_CONTENT" ]]; then
            echo "Missing GitHub development environment secret: SIXLABORS_LICENSE_FILE"
            missing=1
          fi

          exit "$missing"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Prepare Six Labors build secret
        env:
          SIXLABORS_LICENSE_FILE_CONTENT: ${{ secrets.SIXLABORS_LICENSE_FILE }}
        run: |
          license_file="$RUNNER_TEMP/sixlabors.lic"
          printf '%s' "$SIXLABORS_LICENSE_FILE_CONTENT" > "$license_file"
          chmod 600 "$license_file"
          echo "SIXLABORS_LICENSE_FILE_PATH=$license_file" >> "$GITHUB_ENV"

      - name: Build development container image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPOSITORY }}/${{ env.GCP_IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker build \
            --secret "id=sixlabors_license,src=$SIXLABORS_LICENSE_FILE_PATH" \
            --tag "$IMAGE_URI" \
            .
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Push development container image
        run: |
          docker push "$IMAGE_URI"
          image_digest=$(gcloud artifacts docker images describe "$IMAGE_URI" \
            --project="$GCP_PROJECT_ID" \
            --format='value(image_summary.digest)')
          if [[ -z "$image_digest" ]]; then
            echo "Artifact Registry did not return an image digest."
            exit 1
          fi
          echo "IMAGE_DIGEST_URI=${IMAGE_URI%:*}@$image_digest" >> "$GITHUB_ENV"

      - name: Deploy development database migration job
        run: |
          gcloud run jobs deploy "$GCP_MIGRATION_JOB" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="$IMAGE_DIGEST_URI" \
            --service-account="$GCP_MIGRATION_SERVICE_ACCOUNT" \
            --set-env-vars="ASPNETCORE_ENVIRONMENT=Production" \
            --set-secrets="ConnectionStrings__MigrationConnection=${GCP_MIGRATION_CONNECTION_SECRET}:latest" \
            --args="--vexorion-operation=migrate" \
            --tasks=1 \
            --parallelism=1 \
            --max-retries=0 \
            --task-timeout=10m \
            --quiet

      - name: Apply development database migrations
        run: |
          migration_execution=$(gcloud run jobs execute "$GCP_MIGRATION_JOB" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --wait \
            --format='value(metadata.name)' \
            --quiet)
          if [[ -z "$migration_execution" ]]; then
            echo "Cloud Run did not return the migration execution name."
            exit 1
          fi
          echo "MIGRATION_EXECUTION=$migration_execution" >> "$GITHUB_ENV"

      - name: Deploy development API revision
        run: |
          gcloud run services update "$GCP_CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="$IMAGE_DIGEST_URI" \
            --no-invoker-iam-check \
            --quiet

      - name: Verify development deployment
        run: |
          service_json=$(gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format=json)
          service_url=$(jq -r '.status.url' <<< "$service_json")
          deployed_image=$(jq -r '.spec.template.spec.containers[0].image' <<< "$service_json")
          created_revision=$(jq -r '.status.latestCreatedRevisionName' <<< "$service_json")
          ready_revision=$(jq -r '.status.latestReadyRevisionName' <<< "$service_json")

          if [[ -z "$service_url" || "$service_url" == "null" ]]; then
            echo "Cloud Run did not return a development service URL."
            exit 1
          fi
          if [[ "$created_revision" != "$ready_revision" ]]; then
            echo "Development revision $created_revision is not ready; latest ready revision is $ready_revision."
            exit 1
          fi
          if [[ "$deployed_image" != "$IMAGE_DIGEST_URI" ]]; then
            echo "Development revision image does not match the pushed immutable digest."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --retry 8 --retry-delay 5 --retry-all-errors \
            "$service_url/health/live"
          curl --fail-with-body --silent --show-error \
            --retry 8 --retry-delay 5 --retry-all-errors \
            "$service_url/health/ready"

          auth_status=$(curl --silent --output /dev/null --write-out='%{http_code}' \
            "$service_url/api/auth/me")
          if [[ "$auth_status" != "401" ]]; then
            echo "Expected anonymous /api/auth/me to return 401; received $auth_status."
            exit 1
          fi

          {
            echo "### Development deployment"
            echo
            echo "- Revision: \`$ready_revision\`"
            echo "- Image: \`$IMAGE_DIGEST_URI\`"
            echo "- Migration execution: \`$MIGRATION_EXECUTION\`"
            echo "- Live and ready health: passed"
            echo "- Anonymous authorization check: passed"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy to Cloud Run (production)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: production
    concurrency:
      group: production-cloud-run-traffic
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
      GCP_MIGRATION_JOB: ${{ vars.GCP_MIGRATION_JOB }}
      GCP_MIGRATION_SERVICE_ACCOUNT: ${{ vars.GCP_MIGRATION_SERVICE_ACCOUNT }}
      GCP_MIGRATION_CONNECTION_SECRET: ${{ vars.GCP_MIGRATION_CONNECTION_SECRET }}
      GCP_IMAGE_NAME: ${{ vars.GCP_IMAGE_NAME }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      RELEASE_EVIDENCE_DIR: release-evidence

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize release evidence
        run: |
          mkdir -p "$RELEASE_EVIDENCE_DIR"
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg workflowRun "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg startedAtUtc "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{commit: $commit, workflowRun: $workflowRun, startedAtUtc: $startedAtUtc}' \
            > "$RELEASE_EVIDENCE_DIR/workflow-context.json"

      - name: Validate deployment configuration
        env:
          SIXLABORS_LICENSE_FILE_CONTENT: ${{ secrets.SIXLABORS_LICENSE_FILE }}
          EMAIL__RESENDAPIKEY: ${{ secrets.EMAIL__RESENDAPIKEY }}
          EMAIL__MAINUIBASEURL: ${{ vars.EMAIL__MAINUIBASEURL }}
          EMAIL__FROMADDRESS: ${{ vars.EMAIL__FROMADDRESS }}
        run: |
          missing=0
          for variable_name in \
            GCP_PROJECT_ID \
            GCP_REGION \
            GCP_ARTIFACT_REPOSITORY \
            GCP_CLOUD_RUN_SERVICE \
            GCP_MIGRATION_JOB \
            GCP_MIGRATION_SERVICE_ACCOUNT \
            GCP_MIGRATION_CONNECTION_SECRET \
            GCP_IMAGE_NAME \
            GCP_WORKLOAD_IDENTITY_PROVIDER \
            GCP_DEPLOY_SERVICE_ACCOUNT \
            EMAIL__MAINUIBASEURL \
            EMAIL__FROMADDRESS
          do
            if [[ -z "${!variable_name}" ]]; then
              echo "Missing GitHub production environment variable: $variable_name"
              missing=1
            fi
          done

          if [[ -z "$EMAIL__RESENDAPIKEY" ]]; then
            echo "Missing GitHub production environment secret: EMAIL__RESENDAPIKEY"
            missing=1
          fi

          if [[ -z "$SIXLABORS_LICENSE_FILE_CONTENT" ]]; then
            echo "Missing GitHub production environment secret: SIXLABORS_LICENSE_FILE"
            missing=1
          fi

          exit "$missing"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Capture pre-deployment revision
        run: |
          previous_revision=$(gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='value(status.latestReadyRevisionName)')
          if [[ -z "$previous_revision" ]]; then
            echo "Cloud Run did not return a current ready revision."
            exit 1
          fi
          echo "PREVIOUS_READY_REVISION=$previous_revision" >> "$GITHUB_ENV"

      - name: Configure Artifact Registry authentication
        run: gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet

      - name: Prepare Six Labors build secret
        env:
          SIXLABORS_LICENSE_FILE_CONTENT: ${{ secrets.SIXLABORS_LICENSE_FILE }}
        run: |
          license_file="$RUNNER_TEMP/sixlabors.lic"
          printf '%s' "$SIXLABORS_LICENSE_FILE_CONTENT" > "$license_file"
          chmod 600 "$license_file"
          echo "SIXLABORS_LICENSE_FILE_PATH=$license_file" >> "$GITHUB_ENV"

      - name: Build container image
        env:
          IMAGE_URI: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.GCP_ARTIFACT_REPOSITORY }}/${{ env.GCP_IMAGE_NAME }}:${{ github.sha }}
        run: |
          docker build \
            --secret "id=sixlabors_license,src=$SIXLABORS_LICENSE_FILE_PATH" \
            --tag "$IMAGE_URI" \
            .
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Push container image
        run: |
          docker push "$IMAGE_URI"
          image_digest=$(gcloud artifacts docker images describe "$IMAGE_URI" \
            --project="$GCP_PROJECT_ID" \
            --format='value(image_summary.digest)')
          if [[ -z "$image_digest" ]]; then
            echo "Artifact Registry did not return an image digest."
            exit 1
          fi
          echo "IMAGE_DIGEST_URI=${IMAGE_URI%:*}@$image_digest" >> "$GITHUB_ENV"

      - name: Deploy database migration job
        run: |
          gcloud run jobs deploy "$GCP_MIGRATION_JOB" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="$IMAGE_DIGEST_URI" \
            --service-account="$GCP_MIGRATION_SERVICE_ACCOUNT" \
            --set-env-vars="ASPNETCORE_ENVIRONMENT=Production" \
            --set-secrets="ConnectionStrings__MigrationConnection=${GCP_MIGRATION_CONNECTION_SECRET}:latest" \
            --args="--vexorion-operation=migrate" \
            --tasks=1 \
            --parallelism=1 \
            --max-retries=0 \
            --task-timeout=10m \
            --quiet

      - name: Apply pending database migrations
        run: |
          migration_execution=$(gcloud run jobs execute "$GCP_MIGRATION_JOB" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --wait \
            --format='value(metadata.name)' \
            --quiet
          )
          if [[ -z "$migration_execution" ]]; then
            echo "Cloud Run did not return the migration execution name."
            exit 1
          fi
          echo "MIGRATION_EXECUTION=$migration_execution" >> "$GITHUB_ENV"
          gcloud run jobs executions describe "$migration_execution" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format=json \
            > "$RELEASE_EVIDENCE_DIR/migration-execution.json"

      - name: Deploy immutable revision
        env:
          EMAIL__RESENDAPIKEY: ${{ secrets.EMAIL__RESENDAPIKEY }}
          EMAIL__MAINUIBASEURL: ${{ vars.EMAIL__MAINUIBASEURL }}
          EMAIL__FROMADDRESS: ${{ vars.EMAIL__FROMADDRESS }}
        run: |
          env_vars="EMAIL__RESENDAPIKEY=${EMAIL__RESENDAPIKEY}"
          env_vars+="|EMAIL__MAINUIBASEURL=${EMAIL__MAINUIBASEURL}"
          env_vars+="|EMAIL__FROMADDRESS=${EMAIL__FROMADDRESS}"
          env_vars+="|EMAIL__REDIRECTPLUSADDRESSING=false"

          gcloud run services update "$GCP_CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --image="$IMAGE_DIGEST_URI" \
            --update-env-vars="^|^${env_vars}" \
            --no-invoker-iam-check \
            --quiet

      - name: Verify deployed revision
        run: |
          service_json=$(gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format=json)
          service_url=$(jq -r '.status.url' <<< "$service_json")
          deployed_image=$(jq -r '.spec.template.spec.containers[0].image' <<< "$service_json")
          created_revision=$(jq -r '.status.latestCreatedRevisionName' <<< "$service_json")
          ready_revision=$(jq -r '.status.latestReadyRevisionName' <<< "$service_json")
          traffic_percent=$(jq -r --arg revision "$ready_revision" \
            '[.status.traffic[] | select(.revisionName == $revision) | (.percent // 0)] | add // 0' \
            <<< "$service_json")

          SERVICE_URL="$service_url" \
          EXPECTED_IMAGE="$IMAGE_DIGEST_URI" \
          EXPECTED_REVISION="$created_revision" \
          ACTUAL_IMAGE="$deployed_image" \
          ACTUAL_REVISION="$ready_revision" \
          TRAFFIC_PERCENT="$traffic_percent" \
          EVIDENCE_DIR="$RELEASE_EVIDENCE_DIR" \
          scripts/release/verify-production.sh

          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg workflowRun "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg previousRevision "$PREVIOUS_READY_REVISION" \
            --arg deployedRevision "$ready_revision" \
            --arg image "$IMAGE_DIGEST_URI" \
            --arg migrationExecution "$MIGRATION_EXECUTION" \
            --arg verifiedAtUtc "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{commit: $commit, workflowRun: $workflowRun, previousRevision: $previousRevision, deployedRevision: $deployedRevision, image: $image, migrationExecution: $migrationExecution, verifiedAtUtc: $verifiedAtUtc}' \
            > "$RELEASE_EVIDENCE_DIR/release-metadata.json"

          cat "$RELEASE_EVIDENCE_DIR/production-verification.md" >> "$GITHUB_STEP_SUMMARY"
          {
            echo
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Previous ready revision: \`$PREVIOUS_READY_REVISION\`"
            echo "- Migration execution: \`$MIGRATION_EXECUTION\`"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-release-evidence-${{ github.sha }}
          path: release-evidence/
          if-no-files-found: error
          retention-days: 90
