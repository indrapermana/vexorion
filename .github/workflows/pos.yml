name: POS Frontend

on:
  push:
    branches: [master, develop]
    paths:
      - 'VexorionERP.POS/**'
      - '.github/workflows/pos.yml'
  pull_request:
    branches: [master, develop]
    paths:
      - 'VexorionERP.POS/**'
      - '.github/workflows/pos.yml'

defaults:
  run:
    working-directory: VexorionERP.POS

jobs:
  build-and-test:
    name: Build & Test (POS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: VexorionERP.POS/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Unit tests (with coverage)
        run: npm test -- --coverage --reporter=default --reporter=junit --outputFile=test-results.xml

      - name: Build
        run: npm run build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pos-test-results
          path: VexorionERP.POS/test-results.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pos-coverage
          path: VexorionERP.POS/coverage/

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: VexorionERP.POS/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pos-playwright-report
          path: VexorionERP.POS/playwright-report/
