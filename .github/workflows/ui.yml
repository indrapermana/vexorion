name: UI Frontend

on:
  push:
    branches: [main, develop]
    paths:
      - 'VexorionERP.UI/**'
      - '.github/workflows/ui.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'VexorionERP.UI/**'
      - '.github/workflows/ui.yml'

defaults:
  run:
    working-directory: VexorionERP.UI

jobs:
  build-and-test:
    name: Build & Test (UI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: VexorionERP.UI/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc -b --noEmit

      - name: Unit tests (with coverage)
        run: npm run test:run -- --coverage --reporter=default --reporter=junit --outputFile=test-results.xml

      - name: Build
        run: npm run build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: VexorionERP.UI/test-results.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-coverage
          path: VexorionERP.UI/coverage/

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: VexorionERP.UI/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: VexorionERP.UI

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: VexorionERP.UI

      - name: Run E2E tests
        run: npm run e2e
        working-directory: VexorionERP.UI
        env:
          ERP_BASE_URL: ${{ secrets.ERP_BASE_URL || 'http://localhost:5173' }}
          E2E_TENANT_CODE: ${{ secrets.E2E_TENANT_CODE || 'demo' }}
          E2E_USERNAME: ${{ secrets.E2E_USERNAME || 'admin@demo.local' }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD || 'DemoAdmin123!' }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-playwright-report
          path: VexorionERP.UI/playwright-report/
